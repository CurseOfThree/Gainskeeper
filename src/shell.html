<title>Gainskeeper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#e7e9ec;--panel:#f6f7f8;--raised:#fff;--ink:#12161a;--muted:#566069;--line:#cbd0d6;--blue:#1c4ed8;--blue-ink:#fff;--blue-soft:#dfe7fb;--yellow:#f2b705;--yellow-ink:#1a1400;--yellow-soft:#fbefc2;--green:#17803f;--green-soft:#dcf1e3;--red:#c42b25;--red-soft:#f8dcda;--knurl:#b3bac2;--shadow:0 1px 0 rgba(0,0,0,.04);--mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
--disp:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1215;--panel:#171b1f;--raised:#1f2429;--ink:#e8ebee;--muted:#98a2ab;--line:#2e353c;--blue:#7c9eff;--blue-ink:#0b1020;--blue-soft:#1b2748;--yellow-soft:#3a3006;--green:#3fbf72;--green-soft:#14301f;--red:#ff7a72;--red-soft:#3a1816;--knurl:#3a424b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1215;--panel:#171b1f;--raised:#1f2429;--ink:#e8ebee;--muted:#98a2ab;--line:#2e353c;--blue:#7c9eff;--blue-ink:#0b1020;--blue-soft:#1b2748;--yellow-soft:#3a3006;--green:#3fbf72;--green-soft:#14301f;--red:#ff7a72;--red-soft:#3a1816;--knurl:#3a424b;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;-webkit-text-size-adjust:100%}
#app{max-width:640px;margin:0 auto;padding:12px 0 96px;min-width:0}

h2{font-size:22px}h3{font-size:18px}
p{margin:0}.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 10px}

.brand small{display:block;font:500 12px var(--body);letter-spacing:.02em;text-transform:none;color:var(--muted);margin-top:4px}

.sets input{font-family:var(--mono);font-weight:500}
@keyframes pop{0%{transform:scale(.88)}100%{transform:scale(1)}}
.tick.on{animation:pop .16s ease-out}

.sync{font-size:12px;color:var(--muted);text-align:right}

.cxb:hover,.cxb:focus-visible{background:var(--raised);color:var(--ink)}

.card.cc>*:not(.chead):not(.cxb){display:none}

.card.cc .cxb svg{transform:rotate(-90deg)}
.stack{display:flex;flex-direction:column;gap:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn.warn{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.5}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.lbl{display:block;font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input,select,textarea{font:16px var(--body);color:var(--ink);background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-height:44px;min-width:0}
textarea{min-height:110px;resize:vertical}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
.tabs{display:flex;width:100%;max-width:640px;gap:2px}
.tab{flex:1;background:none;border:0;color:var(--muted);font:600 11px var(--body);letter-spacing:.04em;text-transform:uppercase;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-height:48px;border-radius:8px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--blue)}
.pips{display:flex;gap:8px;align-items:center}
.pip{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:transparent}
.pip.on{background:var(--green);border-color:var(--green)}
.big{font-family:var(--disp);font-weight:700;font-size:40px;line-height:1}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk .d{height:40px;border-radius:10px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;font:600 13px var(--body);color:var(--muted)}
.wk .d.plan{border-style:solid;border-color:var(--blue);color:var(--blue)}
.wk .d.done{background:var(--green);border:1.5px solid var(--green);color:#fff}
.wk .d.today{box-shadow:0 0 0 2px var(--ink) inset}
.tag{display:inline-block;font:600 11px var(--body);letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:2px 7px;background:var(--blue-soft);color:var(--blue)}
.tag.y{background:var(--yellow-soft);color:var(--ink)}.tag.g{background:var(--green-soft);color:var(--green)}.tag.r{background:var(--red-soft);color:var(--red)}
.li{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.exn{font-weight:600}
.ss{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:var(--yellow);color:var(--yellow-ink);font:700 12px var(--body);margin-right:6px}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.ex.ssb{border-left:4px solid var(--yellow)}
.hint{font-size:13px;color:var(--muted);margin-top:2px}.hint.b{color:var(--blue)}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 52px;gap:8px;align-items:center;margin-top:8px}

.sets .hdr{font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
#restbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:19;padding:0 max(16px,env(safe-area-inset-left,0px))}
#restbar .in{max-width:640px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 10px 8px 14px;display:flex;align-items:center;gap:10px}
#restbar .t{font:700 28px var(--disp);letter-spacing:.04em;min-width:64px}

.wu{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}.wu .tick{width:40px;height:40px;flex:none}

.sub{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.scroll{overflow-x:auto}

.notice{background:var(--yellow-soft);border:1px solid var(--yellow);border-radius:10px;padding:10px;font-size:14px}
.err{background:var(--red-soft);border:1px solid var(--red);border-radius:10px;padding:10px;font-size:14px}

.dots{display:inline-flex;gap:3px;vertical-align:middle}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--green)}
a{color:var(--blue)}
.lib h3{text-transform:none;font-family:var(--body);font-size:16px;letter-spacing:0;font-weight:600}
.sr{position:absolute;left:-9999px}

apply plugin: 'com.android.application'

android {
    namespace = "com.curseofthree.gainskeeper.wear"
    compileSdk = 36
    defaultConfig {
        // Same application id and signing key as the phone app: Wear OS only links the two when both match.
        applicationId "com.curseofthree.gainskeeper"
        minSdkVersion 30
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        release {
            storeFile file('../../keystore/gainskeeper.jks')
            storePassword 'gainskeeper-keep'
            keyAlias 'gainskeeper'
            keyPassword 'gainskeeper-keep'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation "com.google.android.gms:play-services-wearable:20.0.1"
}
